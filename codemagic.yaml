workflows:
  ios-workflow:
    name: Flamio iOS Unsigned
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: Flamio.xcodeproj
        XCODE_SCHEME: Flamio
    scripts:
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Build app without signing
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package into IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/Flamio.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Flamio-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - maestro_bluentano@proton.me
